# Tabularizer Card — YAML Configuration Schema
# Lovelace card type: custom:tabularizer-card
#
# Minimal example:
#   type: custom:tabularizer-card
#   entities:
#     - entity: sensor.outdoor_temperature
#       name: "Temperature"
#       precision: 1
#     - entity: sensor.precipitation_gauge

type:
  description: REQUIRED. Must be the literal string "custom:tabularizer-card".
  type: string
  const: custom:tabularizer-card

entities:
  description: |
    REQUIRED. Ordered list of HA entities to display as rows.
    - Order is preserved in the rendered table.
    - Duplicate entity IDs are permitted; each entry produces its own row (FR-033 exemption).
    - An empty list renders the no-entities placeholder message (FR-033).
  type: array
  items:
    oneOf:
      - description: "Entity row — displays statistics for a single HA entity."
        type: object
        required:
          - entity
        additionalProperties: false
        properties:
          entity:
            description: |
              REQUIRED. Home Assistant entity ID.
              The entity must have long-term statistics enabled (requires a state_class attribute).
              Supported state_class values: measurement, total_increasing, total.
              If the entity lacks statistics, a warning indicator appears on its label cell (FR-029).
            type: string
            pattern: "^[a-z_]+\\.[a-z0-9_]+$"
            examples:
              - sensor.outdoor_temperature
              - sensor.precipitation_gauge
              - sensor.daily_energy_consumption
          name:
            description: |
              OPTIONAL. Display name shown in the entity label column.
              Overrides the entity's HA friendly name.
              When omitted, the entity's HA friendly name is used (FR-022).
              The unit of measurement is always appended automatically from entity metadata.
            type: string
            examples:
              - "Außentemperatur"
              - "Niederschlag"
              - "Stromverbrauch"
          precision:
            description: |
              OPTIONAL. Number of decimal digits shown in day cells and summary columns for this entity.
              When omitted, values are shown with their full native precision as received from HA.
            type: integer
            minimum: 0
            maximum: 10
            examples:
              - 0
              - 1
              - 2
          factor:
            description: |
              OPTIONAL. Numeric multiplier applied to all displayed values for this entity
              (day cells and summary columns). Typically used with `unit` to rescale
              values (e.g. Wh→kWh: factor=0.001, unit="kWh").
              Default: 1 (no scaling). Not available on expression rows.
            type: number
            examples:
              - 0.001
              - 1000
          unit:
            description: |
              OPTIONAL. Unit of measurement string shown in the label column.
              Overrides the HA-provided unit of measurement.
              When omitted, the entity's HA unit of measurement is used.
              Not available on expression rows.
            type: string
            examples:
              - "kWh"
              - "°C"
              - "mm"
          show_zero:
            description: |
              OPTIONAL. When false, day cells whose computed value is exactly 0 render
              as blank (no content, no data styling). Summary columns (min/avg/max/total)
              are always shown regardless of this setting.
              Default: true (zero values shown).
            type: boolean
            examples:
              - false
          show_min:
            description: |
              OPTIONAL. When false, the min sub-row is hidden for measurement entities
              (day cells and summary value). For cumulative entities, the min value is
              hidden from the summary column only; the day column is unaffected.
              Default: true (min shown).
            type: boolean
            examples:
              - false
          show_avg:
            description: |
              OPTIONAL. When false, the avg sub-row is hidden for measurement entities
              (day cells and summary value). For cumulative entities, the avg value is
              hidden from the summary column only; the day column is unaffected.
              Default: true (avg shown).
            type: boolean
            examples:
              - false
          show_max:
            description: |
              OPTIONAL. When false, the max sub-row is hidden for measurement entities
              (day cells and summary value). For cumulative entities, the max value is
              hidden from the summary column only; the day column is unaffected.
              Default: true (max shown).
            type: boolean
            examples:
              - false
      - description: "Expression row — displays a value derived from an arithmetic expression over entity daily sums."
        type: object
        required:
          - expression
        additionalProperties: false
        properties:
          expression:
            description: |
              REQUIRED. Arithmetic expression combining HA entity IDs and numeric literals.
              Supported operators: +, -, *, /  Grouping: ( )
              Entity IDs are resolved to their daily sum value.
              Wrap in {{ ... }} delimiters (optional).
              Example: "{{ sensor.grid_import - sensor.grid_export }}"
            type: string
            examples:
              - "{{ sensor.grid_import - sensor.grid_export }}"
              - "sensor.a + sensor.b"
          name:
            description: |
              OPTIONAL. Display name shown in the entity label column.
              When omitted, the expression string is used as the label.
            type: string
            examples:
              - "Net Energy"
          unit:
            description: |
              OPTIONAL. Unit of measurement string shown in the label column.
            type: string
            examples:
              - "kWh"
          precision:
            description: |
              OPTIONAL. Number of decimal digits shown in day cells and summary columns.
              When omitted, values are shown with their full native precision.
            type: integer
            minimum: 0
            maximum: 10
          show_zero:
            description: |
              OPTIONAL. When false, day cells whose computed value is exactly 0 render as blank.
              Default: true.
            type: boolean
